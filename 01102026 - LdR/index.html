<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#f5f7fa">
    <title>Calculadora de operações</title>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="Calculadora, página inicial">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span>Calculadora</span>
        </a>
        <span class="topbar-caption">Ferramentas de cálculo</span>
    </header>

    <main class="page-shell">
        <section class="page-intro" aria-labelledby="page-title">
            <p class="eyebrow">CÁLCULOS DO DIA A DIA</p>
            <h1 id="page-title">Uma conta de cada vez.</h1>
            <p class="intro-copy">Informe os valores e escolha a operação para ver o resultado.</p>
        </section>

        <section class="calculator-panel" aria-labelledby="form-title">
            <div class="panel-heading">
                <span class="section-index" aria-hidden="true">01</span>
                <div>
                    <h2 id="form-title">Nova operação</h2>
                    <p>Preencha os campos abaixo.</p>
                </div>
            </div>

            <form action="calcular.php" method="post" class="calculator-form">
                <div class="field-grid">
                    <div class="field">
                        <label for="num1">Primeiro número</label>
                        <input type="number" name="num1" id="num1" step="any" placeholder="Ex.: 24" required>
                    </div>
                    <div class="field">
                        <label for="num2">Segundo número</label>
                        <input type="number" name="num2" id="num2" step="any" placeholder="Ex.: 6" required>
                    </div>
                </div>

                <div class="field">
                    <label for="operacao">Operação</label>
                    <select name="operacao" id="operacao" required>
                        <option value="soma">Soma</option>
                        <option value="subtracao">Subtração</option>
                        <option value="multiplicacao">Multiplicação</option>
                        <option value="divisao">Divisão</option>
                        <option value="tabuada">Tabuada</option>
                    </select>
                </div>

                <button class="button button-primary" type="submit">Calcular <span aria-hidden="true">→</span></button>
            </form>
        </section>
        <footer class="page-footer">Calculadora de operações <span aria-hidden="true">·</span> Uso simples e direto</footer>
    </main>
</body>
</html>
